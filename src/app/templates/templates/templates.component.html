<!-- template.component.html -->
<div class="template-container">
  <div class="template-header">
    <h2>Templates</h2>
    <div class="template-controls">
      <label for="sort">Sort by:</label>
      <select id="sort">
        <option value="name">Name</option>
        <option value="type">Type</option>
        <option value="sentAt">Sent Date</option>
      </select>
      <button [routerLink]="['/dashboard/templates/create']" class="add-button">+ Add Template</button>
    </div>
  </div>

  <div class="template-section">
    <h3>Image Templates</h3>
    <div class="template-grid">
      <div class="template-card" *ngFor="let template of imageTypes | paginate: { itemsPerPage: 6, currentPage: currentpage }">
        <img [src]="template.content.imagePath" alt="Template Image" />
        <div class="card-content">
          <h4>{{ template.name }}</h4>
          <p><strong>Type:</strong> {{ template.type }}</p>
          <p class="date">Sent: {{ template.createdAt | date:'mediumDate' }}</p>
          <div class="card-actions">
            <button [routerLink]="['/dashboard/templates/view', template._id]">View</button>
            <button [routerLink]="['/dashboard/templates/edit', template._id]">Edit</button>
            <button (click)="delete(template._id)" class="danger">Delete</button>
          </div>
        </div>
      </div>
       
    </div>

    <h3>Text Templates</h3>
    <table class="template-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Content</th>
          <th>Sent At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let template of textTypes | paginate: { itemsPerPage: 2, currentPage: currentpage }">    
          <td>{{ template.name }}</td>
          <td>{{ template.type }}</td>
          <td>{{ template.content.text }}</td>
          <td>{{ template.createdAt | date:'mediumDate' }}</td>
          <td>
            <button [routerLink]="['/dashboard/templates/view', template._id]">View</button>
            <button [routerLink]="['/dashboard/templates/edit', template._id]" [ngClass]="{'denied':call(template.createdBy)}">Edit</button>
            <button (click)="delete(template._id)" class="danger" [ngClass]="{'denied':call(template.createdBy)}">Delete</button>
          </td>       
        </tr>
      </tbody>
    </table>
    <pagination-controls (pageChange)="currentpage = $event"></pagination-controls>
  </div>
</div>
