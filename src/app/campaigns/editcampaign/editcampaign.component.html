<div class="create-container">
  <h2>Create New Campaign</h2>
  <form (ngSubmit)="submitCampaign()" [formGroup]="editform">
    <div class="form-group">
      <label>Campaign Name</label>
      <input type="text" formControlName="name" required placeholder="Enter campaign name" />
    </div>

    <!-- Workspace (reactive if you need later)
    <div class="form-group">
      <label>Select Workspace</label>
      <select formControlName="workspace" required>
        <option *ngFor="let ws of workspaces" [ngValue]="ws">{{ ws.name }}</option>
      </select>
    </div>
    -->

    <!-- <div class="form-group">
      <label>Select Template</label>
      <select formControlName="templateId" required>
        <option *ngFor="let tmp of templates" [ngValue]="tmp">
          {{ tmp.name }} ({{ tmp.type }})
        </option>
      </select>
    </div>

    <div class="template-preview" *ngIf="editform.value.templateId">
      <h3>Template Preview</h3>
      <p>{{ editform.value.templateId.content.text }}</p>
      <img *ngIf="editform.value.templateId.content.imagePath"
           [src]="editform.value.templateId.content.imagePath"
           alt="Template Image" />
    </div> -->

    <div class="form-group">
      <label for="text">Enter description</label>
      <textarea
        id="text"
        formControlName="content"
        rows="4"
        placeholder="Enter campaign description"
        formControlName="content"
      ></textarea>
    </div>

    <div class="form-group">
      <label>Tags (space-separated)</label>
      <input type="text" formControlName="tags" placeholder="e.g., VIP, New Users" />
    </div>

    <div class="form-group">
      <label>Schedule Date</label>
      <input formControlName="createdAt" type="date" />
    </div>

    <button type="submit" [disabled]="editform.invalid" class="submit-btn">
      Update
    </button>
  </form>
</div>
