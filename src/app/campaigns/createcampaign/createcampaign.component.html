<div class="create-container">
  <h2>Create New Campaign</h2>
  <form (ngSubmit)="submitCampaign()" [formGroup]="addform">
    <div class="form-group">
      <label>Campaign Name</label>
      <input type="text" formControlName="name" required placeholder="Enter campaign name" />
    </div>

    <div class="form-group">
      <!-- <label>Select Workspace</label>
      <select name="workspace" required>
        <option *ngFor="let ws of workspaces" [value]="ws._id">{{ ws.name }}</option>
      </select>
      -->
    </div> 

    <div class="form-group">
      <label>Select Template</label>
      <select name="template" required>
        <option *ngFor="let tmp of templates" [value]="tmp._id">{{ tmp.name }} ({{ tmp.type }})</option>
      </select>
    </div>

    <div class="template-preview" *ngIf="selectedTemplate">
      <h3>Template Preview</h3>
      <p>{{ selectedTemplate.content.text }}</p>
      <img *ngIf="selectedTemplate.content.imagePath" [src]="selectedTemplate.content.imagePath" alt="Template Image" />
    </div>

    <div class="form-group">
      <label>Tags (comma-separated)</label>
      <input type="text" name="campaignTags" placeholder="e.g., VIP, New Users" />
    </div>

    <div class="form-group">
      <label>Schedule Date</label>
      <input type="date" name="scheduledDate" />
    </div>

    <button type="submit" [disabled]="addform.invalid" class="submit-btn">
      Create Campaign
    </button>
  </form>
</div>
