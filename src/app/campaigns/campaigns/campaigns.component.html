<div class="campaign-list-container">
  <div class="header">
    <h2>Campaigns</h2>
    <button class="create-btn" [routerLink]="['/dashboard/campaigns/create']">+ Create New Campaign</button>
  </div>

  <table class="campaign-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Tags</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of campaigns">
        <td><a [routerLink]="['view', c._id]">{{ c.name }}</a></td>
        <td><span class="status-badge">{{ c.status }}</span></td>
        <td>
          <ng-container *ngFor="let tag of c.tags">
            <span class="tag-badge">{{ tag }}</span>
          </ng-container>
        </td>
        <td>{{ c.createdAt | date:'mediumDate' }}</td>
        <td class="actions">
          <button *ngIf="c.status === 'Draft'" [routerLink]="['edit', c._id]">Edit</button>
          <button [routerLink]="['view', c._id]">View</button>
          <button *ngIf="c.status === 'Draft'">Launch</button>
          <button>Copy</button>
          <button (click)="deleteCampaign(c._id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
