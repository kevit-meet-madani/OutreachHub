<div class="dropdown-container">
  <label class="dropdown-label">{{ placeholder }}</label>
  <select
    class="dropdown-select"
    [(ngModel)]="selectedValue"
    (click)="getVal()"
  >
    <option *ngFor="let opt of workspaces" [value]="opt._id">
      {{ opt.name}}
    </option>
  </select>
</div>
